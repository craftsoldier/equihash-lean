name: Lean

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    # The required status check on `main`.
    name: Lean CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each folder in `rust/` must be its pinned source, unmodified: a crates.io crate
      # (its `.crate` file's SHA-256, also checked against the crates.io index). One pin per line:
      #   crates <name> <version> <sha256> <folder>
      - name: Check the pinned sources
        env:
          PINS: |
            crates zakura-equihash 5.4.0 e43cca7a1758ef0075c5b810dd02acd536bb089e2d34f987026fdafa7aa1176f rust/zakura-equihash-5.4.0
            crates equihash 0.3.0 306286e8dcc39ab3dfceb74c792ce8baffdab90591321d3ffaae64829734c37f rust/equihash-0.3.0
            crates equihash 0.3.1 49eac9289a160ac92d99537b3434a1a3696df0177fe2c66818bdb9a33b6d5770 rust/equihash-0.3.1
        run: |
          set -euo pipefail
          pinned=()
          while read -r kind a b c folder; do
            [ -n "$kind" ] || continue
            pinned+=("$folder")
            tmp=$(mktemp -d)
            case "$kind" in
              crates)
                name=$a version=$b sha=$c
                # Index paths are lowercase.
                lower=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')
                case ${#lower} in
                  1) prefix=1 ;;
                  2) prefix=2 ;;
                  3) prefix=3/${lower:0:1} ;;
                  *) prefix=${lower:0:2}/${lower:2:2} ;;
                esac
                indexed=$(curl -sSfL "https://index.crates.io/$prefix/$lower" \
                  | jq -r --arg v "$version" 'select(.vers == $v) | .cksum')
                [ "$indexed" = "$sha" ] \
                  || { echo "::error::$name $version: index checksum $indexed, pinned $sha"; exit 1; }
                curl -sSfL -o "$tmp/crate" \
                  "https://static.crates.io/crates/$name/$name-$version.crate"
                echo "$sha  $tmp/crate" | sha256sum -c -
                tar -xzf "$tmp/crate" -C "$tmp"
                source="$tmp/$name-$version"
                ;;
              *) echo "::error::unknown pin kind $kind"; exit 1 ;;
            esac
            diff -r "$source" "$folder" \
              || { echo "::error::$folder differs from its pinned source"; exit 1; }
            echo "$folder: matches its pinned source"
          done <<< "$PINS"
          # Every entry in `rust/`, hidden or not, is a pinned folder.
          while read -r entry; do
            printf '%s\n' "${pinned[@]}" | grep -qxF "$entry" \
              || { echo "::error::$entry has no pin"; exit 1; }
          done < <(find rust -mindepth 1 -maxdepth 1)
      # Each `.tex` file in `spec/` is lines of the protocol specification, copied verbatim
      # below a four-line header whose first line names them:
      #   % Source: zcash/zips commit <sha>, protocol/protocol.tex lines <first>-<last>
      # The commit must be on zcash/zips `main`. This checks the copy, not the labels on lines
      # 2–3, nor that the lines are the whole section.
      - name: Check the specification excerpts
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --no-checkout --single-branch --branch main \
            https://github.com/zcash/zips.git "$RUNNER_TEMP/zips"
          for file in spec/*.tex; do
            re='^% Source: zcash/zips commit ([0-9a-f]{40}), protocol/protocol\.tex lines ([0-9]+)-([0-9]+)$'
            [[ $(head -n 1 "$file") =~ $re ]] || { echo "::error::$file: no source line"; exit 1; }
            commit=${BASH_REMATCH[1]} first=${BASH_REMATCH[2]} last=${BASH_REMATCH[3]}
            git -C "$RUNNER_TEMP/zips" merge-base --is-ancestor "$commit" origin/main \
              || { echo "::error::$file: $commit is not on zcash/zips main"; exit 1; }
            diff <(git -C "$RUNNER_TEMP/zips" show "$commit:protocol/protocol.tex" | sed -n "${first},${last}p") \
              <(tail -n +5 "$file") \
              || { echo "::error::$file differs from protocol.tex lines $first-$last at $commit"; exit 1; }
            echo "$file: matches protocol.tex lines $first-$last at $commit"
          done
          # Every entry in `spec/`, hidden or not, is an excerpt or the license.
          while read -r entry; do
            case "$entry" in
              spec/.*) echo "::error::$entry is hidden, so the check above skips it"; exit 1 ;;
              spec/COPYING.rst | spec/*.tex) ;;
              *) echo "::error::$entry is neither an excerpt nor the license"; exit 1 ;;
            esac
          done < <(find spec -mindepth 1 -maxdepth 1)
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          auto-config: "false"
          build: "true"
          build-args: "--wfail"
          use-mathlib-cache: "true"
          # Our own modules build in about twenty minutes, nearly all of it the release
          # tests' bit flips, and a cached build would skip those `#guard` tests; Mathlib's
          # prebuilt files come from `lake exe cache get`.
          use-github-cache: "false"
